name: Daily News Fetch

on:
  schedule:
    # 每天早上 8:00 UTC+8 = 0:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Fetch daily news
        run: python scripts/fetch_news.py

      - name: Commit updates
        run: |
          git config user.name "bot"
          git config user.email "bot@caishui"
          git add daily_news.js
          git diff --quiet && git diff --staged --quiet || git commit -m "daily: auto-update news $(date +'%Y-%m-%d')"
          git push
